# ==========================================
# Site Settings
# ==========================================
title                    : "Dr. Farid Zamani"
title_separator          : "-"
name                     : "Dr. Farid Zamani Bin Che Rose"
description              : "Senior Lecturer in Statistics & Econometrics at Universiti Putra Malaysia."
url                      : "https://faridzamani.github.io"
baseurl                  : ""

# ==========================================
# Author / Academic Profile Settings
# ==========================================
author:
  name             : "Dr. Farid Zamani Bin Che Rose"
  avatar           : "bio-photo.jpg"
  bio              : "Senior Lecturer in Statistics & Econometrics specializing in time series modeling, structural break detection, and statistical machine learning."
  location         : "Serdang, Selangor, Malaysia"
  employer         : "Universiti Putra Malaysia"
  email            : "faridzamani@upm.edu.my"
  uri              : "https://faridzamani.github.io"
  github           : "faridzamani"
  googlescholar    : ""
  orcid            : ""
  researchgate     : ""
  linkedin         : ""

# ==========================================
# Site Options & Theme
# ==========================================
site_theme               : "default" # Options: default, air, contrast, dirt, mint, sunrise
locale                   : "en-US"
timezone                 : "Asia/Kuala_Lumpur"

# ==========================================
# Jekyll Configuration & Plugins
# ==========================================
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

include:
  - _pages
  - _files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .bundle
  - .github

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# ==========================================
# Site Collections
# ==========================================
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# ==========================================
# Layout Defaults
# ==========================================
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "single"
      author_profile: true
